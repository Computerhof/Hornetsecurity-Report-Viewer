name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (Daten, Syntax, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Daten-Gate (keine echten Reportdaten, nur erlaubte Pfade)
        run: npm run gate:data

      - name: Syntax-Prüfung
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Build-Ergebnis prüfen
        run: |
          f=dist/Hornetsecurity-Report-Viewer.html
          v=$(node -p "require('./package.json').version")
          grep -q "Hornetsecurity Report Viewer v$v" "$f"
          grep -q "office@chrive-solutions.at" "$f"
          ! grep -q "__VERSION__\|/\*__CORE__\*/\|/\*__UI__\*/" "$f"
          ! grep -qE "<script[^>]+src=|<link[^>]+href=\"https?:" "$f"
          echo "OK: $f (v$v) ist eigenständig, Version und Lizenzhinweis vorhanden."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hornetsecurity-Report-Viewer
          path: dist/Hornetsecurity-Report-Viewer.html
          retention-days: 14
