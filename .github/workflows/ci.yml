name: CI

on:
  push:
    branches: [main]
  pull_request:
    # labeled/unlabeled: Doku-Gate reagiert auf das Label "keine-doku"
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: Gates (Daten, Syntax, Tests, Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Daten-Gate (keine echten Reportdaten, nur erlaubte Pfade)
        run: npm run gate:data

      - name: Syntax-Prüfung
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        shell: pwsh
        run: ./build.ps1

      - name: Build-Ergebnis prüfen
        run: |
          f=dist/Hornetsecurity-Report-Viewer.html
          v=$(node -p "require('./package.json').version")
          grep -q "Hornetsecurity Report Viewer v$v" "$f"
          grep -q "office@chrive-solutions.at" "$f"
          ! grep -q "__VERSION__\|/\*__CORE__\*/\|/\*__UI__\*/" "$f"
          ! grep -qE "<script[^>]+src=|<link[^>]+href=\"https?:" "$f"
          echo "OK: $f (v$v) ist eigenständig, Version und Lizenzhinweis vorhanden."

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Hornetsecurity-Report-Viewer
          path: dist/Hornetsecurity-Report-Viewer.html
          retention-days: 14

  lint:
    name: Lint (JS, Markdown, PowerShell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren (Lockfile, ohne Install-Skripte)
        run: npm ci --ignore-scripts --no-fund --no-audit

      - name: ESLint
        run: npm run lint:js

      - name: markdownlint
        run: npm run lint:md

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }
          ./scripts/lint-ps.ps1

  docs:
    name: Doku-Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Doku zum Code passend?
        env:
          DOCS_GATE_BASE: ${{ github.event.pull_request.base.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: npm run gate:docs

  dependencies:
    name: Abhängigkeiten prüfen
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Neue Abhängigkeiten auf Sicherheitslücken und Lizenzen prüfen
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: never
